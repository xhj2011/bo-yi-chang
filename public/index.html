<body>
<div class="container">
  <h1>博弈场 · 多人公网版</h1>
  <p class="link">每个玩家使用自己的设备访问同一个网址。</p>

  <!-- 首页 -->
  <div id="landing" class="panel">
      <h2>进入游戏</h2>
    <div class="row">
      <input id="nameInput" placeholder="你的昵称" value="" maxlength="12">
    </div>
    <div class="row">
      <button onclick="createRoom()">创建房间</button>
      <button class="secondary" onclick="joinRoom()">加入房间</button>
      <input id="roomInput" placeholder="房间码" maxlength="6" style="width:120px;">
    </div>
    <p class="link" id="statusText"></p>
  </div>

  <!-- 大厅 -->
  <div id="lobby" class="panel hidden">
    <h2>大厅</h2>
    <div class="row">
      <div>房间码：<b id="roomCode"></b></div>
      <button id="copyBtn" class="secondary" onclick="copyRoom()">复制房间码</button>
    </div>
    <div id="playerList"></div>
    <div id="startArea"></div>
  </div>

  <!-- 游戏 -->
  <div id="game" class="panel hidden">
    <div class="row" style="justify-content:space-between;">
      <div class="phase" id="roundLabel"></div>
      <div class="phase" id="phaseLabel"></div>
    </div>
      <div id="scorePanel" class="panel hidden score-panel">
        <div class="scoreboard" id="scoreboard"></div>
      </div>

    <div class="event-name" id="eventName"></div>
    <div class="rule" id="eventRule"></div>
    <div id="gameBody" style="margin-top:14px;"></div>
  </div>

  <!-- 积分榜 -->
  <div id="scorePanelOld" class="panel hidden">
    <h3>积分榜</h3>
    <div class="scoreboard" id="scoreboard"></div>
  </div>

  <!-- 聊天 -->
  <div id="chatPanel" class="panel hidden">
    <h3>讨论区</h3>
    <div id="chatBox" class="chat-box"></div>
    <div class="chat-input-row">
      <input id="chatInput" placeholder="说点什么（可以撒谎）" maxlength="200">
      <button onclick="sendChat()">发送</button>
    </div>
  </div>
  <!-- 情报板 -->
  <div id="infoBoard" class="panel hidden">
    <h3>📋 情报板</h3>
    <div id="infoBoardList"></div>
  </div>
</div>

<script>
let socket;
let heartbeatTimer = null;
let myId = null;
let myRoom = null;
let host = false;
let players = [];
let currentEvent = null;
let phase = '';
let myChoice = null;
let myBid = null;
let myOpponent = null;
let ultimatumOpponent = null;
let scoreAnimated = false;
let ultimatumRole = 'watch';
let ultimatumAnswered = null;
let readConfirmed = false;
let myTrait = null;
let mySkillUsed = false;
let currentCards = [];
let readingInfo = { read: 0, total: 0 };
let selectedSkill = null;
let pendingInfo = null;
let pendingInfoCount = 0;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  socket = new WebSocket(proto + location.host);
  socket.onopen = () => {
    setStatus('已连接服务器');
    if (heartbeatTimer) clearInterval(heartbeatTimer);
    heartbeatTimer = setInterval(() => {
      if (socket && socket.readyState === 1) send({ type: 'ping' });
    }, 20000);
  };
  socket.onclose = () => {
    setStatus('连接断开，请刷新页面重连');
    if (heartbeatTimer) clearInterval(heartbeatTimer);
  };
  socket.onmessage = e => handle(JSON.parse(e.data));
}
connect();

function setStatus(text) {
  document.getElementById('statusText').textContent = text || '';
}

function send(obj) {
  if (socket && socket.readyState === 1) socket.send(JSON.stringify(obj));
}

function createRoom() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { alert('请输入昵称'); return; }
  send({ type: 'create', name });
  setStatus('正在创建房间…');
}

function joinRoom() {
  const name = document.getElementById('nameInput').value.trim();
  const code = document.getElementById('roomInput').value.trim().toUpperCase();
  if (!name) { alert('请输入昵称'); return; }
  if (!code) { alert('请输入房间码'); return; }
  send({ type: 'join', name, roomCode: code });
  setStatus('正在加入房间…');
}

function handle(msg) {
  switch (msg.type) {
    case 'created':
    case 'joined': {
      myId = msg.playerId;
      myRoom = msg.code;
      host = !!msg.host;
      players = msg.players || [];
      document.getElementById('landing').classList.add('hidden');
      document.getElementById('lobby').classList.remove('hidden');
      document.getElementById('chatPanel').classList.remove('hidden');
      document.getElementById('roomCode').textContent = myRoom;
      renderLobby();
      renderScores();
      break;
    }
    case 'lobby': {
      players = msg.players || [];
      renderLobby();
      renderScores();
      break;
    }
    case 'roundStart': {
      players = msg.players || [];
      currentEvent = msg.event;
      phase = 'reading';
      myChoice = null;
      ultimatumRole = 'watch';
      myOpponent = null;
      ultimatumOpponent = null;
      ultimatumAnswered = null;
      readConfirmed = false;
      myTrait = null;
      mySkillUsed = false;
      selectedSkill = null;
      pendingInfo = null;
      pendingInfoCount = 0;
      readingInfo = { read: 0, total: (msg.players || []).length };
        scoreAnimated = false;
      document.getElementById('lobby').classList.add('hidden');
      document.getElementById('game').classList.remove('hidden');
      document.getElementById('scorePanel').classList.remove('hidden');
        document.querySelector('.container').classList.add('in-game');
      document.getElementById('roundLabel').textContent = `第 ${msg.round} / ${msg.totalRounds} 轮`;
      document.getElementById('eventName').textContent = eventIcon(currentEvent.id) + ' ' + currentEvent.name;
      let ruleText = currentEvent.desc;
      if (msg.twist) ruleText += `\n\n⚡ 本局特殊事件：${msg.twist.name}\n${msg.twist.desc}`;
      document.getElementById('eventRule').textContent = ruleText;
      renderGame();
      renderScores();
      break;
    }
    case 'traitSelect': {
      phase = 'trait_select';
      myTrait = null;
      mySkillUsed = false;
      selectedSkill = null;
      pendingInfo = null;
      pendingInfoCount = 0;
      window._traits = msg.traits || [];
      window._traitProgress = { done: 0, total: (msg.players || []).length };
      document.getElementById('lobby').classList.add('hidden');
      document.getElementById('game').classList.remove('hidden');
      document.getElementById('scorePanel').classList.remove('hidden');
      document.querySelector('.container').classList.add('in-game');
      renderGame();
      break;
    }
    case 'traitProgress': {
      window._traitProgress = { done: msg.done, total: msg.total };
      renderGame();
      break;
    }
    case 'spyInfo': {
      window._spyInfo = msg;
      renderGame();
      break;
    }
    case 'privateResult': {
      window._privateResult = msg;
      if (phase === 'reveal' && window._lastRevealMsg) renderReveal(window._lastRevealMsg);
      break;
    }
    case 'publicInfoDelete': {
      if (window._infoBoard && window._infoBoard[msg.playerId]) {
        window._infoBoard[msg.playerId][msg.category] = null;
      }
      const catName = msg.category === 'identity' ? '身份' : msg.category === 'skill' ? '技能' : '分数';
      appendChat('系统', `【情报板】${msg.name} 的${catName}被清除`);
      renderInfoBoard();
      break;
    }
    case 'publicInfo': {
      window._infoBoard = window._infoBoard || {};
      const pid = msg.playerId;
      if (!window._infoBoard[pid]) window._infoBoard[pid] = { name: msg.name, identity: null, skill: null, score: null };
      window._infoBoard[pid][msg.category] = { value: msg.value, modified: !!msg.modified };
      const catName = msg.category === 'identity' ? '身份' : msg.category === 'skill' ? '技能' : '分数';
      appendChat('系统', `【情报板】${msg.name} 公布${catName}：${msg.value}`);
      renderInfoBoard();
      break;
    }
    case 'pendingInfo': {
      pendingInfo = msg.data || {};
      pendingInfoCount = msg.count || 0;
      renderInfoBoard();
      renderGame();
      break;
    }
    case 'pendingInfoCount': {
      pendingInfoCount = msg.count || 0;
      renderInfoBoard();
      break;
    }
    case 'intelligenceOpen': {
      phase = 'intelligence';
      renderGame();
      renderInfoBoard();
      break;
    }
    case 'intelligenceEnd': {
      pendingInfo = null;
      pendingInfoCount = 0;
      renderInfoBoard();
      renderGame();
      break;
    }
    case 'luckInfo': {
      window._luckPoints = msg.points;
      renderGame();
      break;
    }
    case 'cardHand': {
      currentCards = msg.cards || [];
      selectedCard = null;
      renderGame();
      break;
    }
    case 'cardSelected': {
      selectedCard = msg.card || null;
      renderGame();
      break;
    }
    case 'trait': {
      myTrait = msg.trait || null;
      renderGame();
      break;
    }
    case 'discussionOpen': {
      window._discussion = { start: Date.now(), min: msg.minDiscussMs || 30000 };
      phase = 'discussion';
      renderGame();
      break;
    }
    case 'readingProgress': {
      readingInfo = { read: msg.read, total: msg.total };
      renderGame();
      break;
    }
    case 'choiceOpen': {
      phase = 'choosing';
      currentEvent = msg.event || currentEvent;
      players = msg.players || players;
      myChoice = null;
      renderGame();
      renderScores();
      break;
    }
      case 'opponent': {
        if (msg.opponentId) {
          myOpponent = { id: msg.opponentId, name: msg.opponentName };
        } else {
          myOpponent = null;
        }
        renderGame();
        break;
      }

    case 'choiceSubmitted': {
      renderGame();
      break;
    }
    case 'ultimatumPhase': {
      phase = msg.phase === 'propose' ? 'ultimatum_propose' : 'ultimatum_respond';
      ultimatumRole = myId === msg.proposerId ? 'proposer' : (myId === msg.responderId ? 'responder' : 'watch');
        ultimatumOpponent = msg.proposerId === myId ? msg.responderName : (msg.responderId === myId ? msg.proposerName : '');
        ultimatumAnswered = null;
      currentEvent = currentEvent || { name: '最后通牒', desc: '' };
      renderGame();
      break;
    }
    case 'ultimatumOffer': {
      // 回应者收到方案
      phase = 'ultimatum_respond';
      ultimatumRole = 'responder';
      window._offer = { share: msg.share, proposerName: msg.proposerName };
      ultimatumAnswered = null;
      renderGame();
      break;
    }
      case 'centipedeTurn': {
        phase = 'centipede_turn';
        window._centipede = { turn: msg.turn, currentPlayerId: msg.currentPlayerId, currentPlayerName: msg.currentPlayerName, otherPlayerName: msg.otherPlayerName };
        renderGame();
        break;
      }
      case 'duelTurn': {
        phase = 'duel_turn';
        window._duel = { turn: msg.turn, pairIndex: msg.pairIndex, pairCount: msg.pairCount, currentPlayerId: msg.currentPlayerId, currentPlayerName: msg.currentPlayerName, otherPlayerName: msg.otherPlayerName };
        renderGame();
        break;
      }
      case 'repeatPhase': {
        phase = 'repeat_choosing';
        myChoice = null;
        window._repeat = { round: msg.round, maxRound: msg.maxRound };
        renderGame();
        break;
      }
      case 'piratePhase': {
        phase = msg.phase === 'propose' ? 'pirate_propose' : 'pirate_vote';
        window._pirate = {
          phase: msg.phase,
          proposerId: msg.proposerId,
          proposerName: msg.proposerName,
          turn: msg.turn,
          maxAttempts: msg.maxAttempts,
          alivePlayers: msg.alivePlayers || [],
          selfShare: 50
        };
        renderGame();
        break;
      }
      case 'pirateVote': {
        phase = 'pirate_vote';
        window._pirate = {
          phase: 'vote',
          planText: msg.planText,
          proposerName: msg.proposerName,
          myVote: null
        };
        renderGame();
        break;
      }
      case 'auctionOpen': {
        phase = 'auction_bid';
        myBid = null;
        renderGame();
        break;
      }





    case 'reveal': {
      phase = 'reveal';
      window._lastRevealMsg = msg;
      players = msg.players || players;
      if (msg.mode === 'ultimatum') {
        currentEvent = { name: '最后通牒', desc: '提议与回应结果' };
      }
      renderReveal(msg);
      renderScores();
      break;
    }
    case 'gameOver': {
      phase = 'finished';
      currentEvent = { name: '游戏结束', desc: '' };
      renderGameOver(msg);
      break;
    }
    case 'chat': {
      appendChat(msg.name, msg.text);
      break;
    }
    case 'error': {
      alert(msg.message || '错误');
      setStatus(msg.message || '');
      break;
    }
  }
}

        const updateTotal = () => {
          let t = 0;
          inputs.forEach(i => t += parseInt(i.value) || 0);
          const el = document.getElementById('pirateTotal');
          if (el) el.textContent = t;
        };
        inputs.forEach(i => i.addEventListener('input', updateTotal));
        updateTotal();
      }

      if (phase === 'auction_bid') {
        const r = document.getElementById('auctionBidRange');
        if (r) r.addEventListener('input', function () {
          document.getElementById('auctionBidVal').textContent = this.value;
        });
      }



window.centipedeAction = function (action) {
  send({ type: 'centipedeAction', action });
  renderGame();
}

  window.duelAction = function (action) {
    send({ type: 'duelAction', action });
    renderGame();
  }

  window.piratePropose = function () {
    const proposal = {};
    document.querySelectorAll('[data-pirate-id]').forEach(i => {
      proposal[i.dataset.pirateId] = parseInt(i.value) || 0;
    });
    const total = Object.values(proposal).reduce((a, b) => a + b, 0);
    if (total !== 100) { alert('合计必须是100分'); return; }
    send({ type: 'piratePropose', proposal });
    renderGame();
  }
  window.pirateVote = function (accept) {
    window._pirate.myVote = accept;
    send({ type: 'pirateVote', accept });
    renderGame();
  }
  window.auctionBid = function () {
    if (myBid != null) return;
    const val = document.getElementById('auctionBidRange')?.value || 0;
    myBid = Math.min(200, Math.max(0, parseInt(val) || 50));
    send({ type: 'auctionBid', bid: myBid });
    renderGame();
  }

}

function selectStrategyCard(cardId) {
  const card = currentCards.find(c => c.id === cardId);
  if (!card || selectedCard) return;
  selectedCard = card;
  send({ type: 'selectCard', cardId });
  renderGame();
}
function publishInfo(category) {
  send({ type: 'publishInfo', category });
}
function revealMyInfo() {
  send({ type: 'revealMyInfo' });
}
function selectSkill(skillId) {
  const skill = (myTrait && myTrait.skills || []).find(s => s.id === skillId);
  if (!skill || mySkillUsed) return;
  if (skill.target === 'player') {
    selectedSkill = skillId;
    renderGame();
  } else {
    useSkillNow(skillId, null);
  }
}
function useSkillTarget(skillId, targetId) {
  useSkillNow(skillId, targetId);
}
function useSkillNow(skillId, targetId) {
  if (!myTrait || mySkillUsed) return;
  mySkillUsed = true;
  selectedSkill = null;
  send({ type: 'useSkill', skillId, targetId });
  renderGame();
}
function selectTrait(id) {
  const t = (window._traits || []).find(x => x.id === id);
  if (!t) return;
  myTrait = t;
  send({ type: 'selectTrait', traitId: id });
  renderGame();
}
function confirmRead() {
  readConfirmed = true;
  send({ type: 'confirmRead' });
  renderGame();
}

function choose(action) {
  if (myChoice) return;
  myChoice = action;
  send({ type: 'choose', choice: action });
  renderGame();
}

function submitProposal() {
  const share = Math.min(100, Math.max(0, parseInt(document.getElementById('shareRange').value) || 50));
  ultimatumAnswered = 'proposed';
  send({ type: 'ultimatumPropose', share });
  renderGame();
}

window.ultimatumRespond = function (accept) {
  ultimatumAnswered = accept ? 'accepted' : 'rejected';
  send({ type: 'ultimatumRespond', accept });
  renderGame();
};

function startGame() {
  const select = document.getElementById('difficultySelect');
  const difficulty = select ? select.value : 'normal';
  send({ type: 'start', difficulty });
}

function hostNext() {
  if (host) send({ type: 'nextRound' });
}

function phaseLabelText() {
  return phase === 'intelligence' ? '情报阶段' : phase === 'discussion' ? '讨论阶段' : phase === 'reading' ? '阅读阶段' : phase === 'trait_select' ? '身份选择' :
         phase === 'choosing' ? '选择阶段' : phase === 'repeat_choosing' ? '重复囚徒困境' :
         phase === 'ultimatum_propose' ? '提议阶段' :
         phase === 'ultimatum_respond' ? '回应阶段' :
         phase === 'centipede_turn' ? '蜈蚣博弈' : phase === 'duel_turn' ? '决斗' : phase === 'pirate_propose' ? '海盗提案' : phase === 'pirate_vote' ? '海盗投票' : phase === 'auction_bid' ? '全支付拍卖' : phase === 'reveal' ? '结算完成' : '游戏中';
}

function renderReveal(msg) {
  const body = document.getElementById('gameBody');
  let rows = '';
  if (msg.mode === 'normal') {
    rows = players.map(p => {
      const choice = msg.choices[p.id] || (msg.delta[p.id] != null ? '已选择' : '—');
      const delta = msg.delta[p.id] != null ? msg.delta[p.id] : 0;
      return `<div class="result-row"><div class="name">${escapeHtml(p.name)}</div><div>${escapeHtml(choice)}</div><div class="delta ${delta<0?'neg':''}">${delta>0?'+':''}${delta.toFixed(2)}</div></div>`;
    }).join('');
  } else {
    rows = players.map(p => {
      let role = (msg.roles && msg.roles[p.id]) ? msg.roles[p.id] : ((msg.mode === 'centipede' || msg.mode === 'duel' || msg.mode === 'repeat' || msg.mode === 'pirate' || msg.mode === 'auction') ? (msg.delta[p.id] !== 0 ? '参与者' : '旁观') : '旁观');
      let delta = msg.delta[p.id] || 0;
      if (p.name === msg.proposerName) role = '提议者';
      else if (p.name === msg.responderName) role = '回应者';
      return `<div class="result-row"><div class="name">${escapeHtml(p.name)}</div><div>${role}</div><div class="delta ${delta<0?'neg':''}">${delta>0?'+':''}${delta}</div></div>`;
    }).join('');
  }
  body.innerHTML = `
    <div class="phase">本轮结算</div>
    ${window._privateResult ? `<div class="phase" style="color:#a5b4fc;">你的实际收益：${window._privateResult.actualDelta}（公开显示 ${window._privateResult.baseDelta}），你的总分：${window._privateResult.score}</div>` : ''}
    <div class="warn">${escapeHtml(msg.detail || (msg.mode === 'ultimatum' ? (msg.accept ? '交易达成' : '交易破裂') : ''))}</div>
    ${rows}
    ${msg.mode === 'repeat' && msg.finished === false ? '' : (host ? '<button onclick="hostNext()">下一轮</button>' : '<p class="link">等待房主进入下一轮…</p>')}
  `;
  document.getElementById('phaseLabel').textContent = '结算完成';
}

function renderGameOver(msg) {
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('gameBody').innerHTML = `<h2>游戏结束</h2>
    <div class="rule">${msg.sorted.map((p, i) => `第${i+1}名：${escapeHtml(p.name)}（${p.score}分）`).join('\n')}</div>
    <p style="font-size:20px;margin-top:14px;">${escapeHtml(msg.sorted[0]?.name || '')} 获胜！</p>`;
  document.getElementById('phaseLabel').textContent = '游戏结束';
}

function renderScores() {
  const panel = document.getElementById('scorePanel');
  if (!players.length) { panel.classList.add('hidden'); return; }
  panel.classList.remove('hidden');
  document.getElementById('scoreboard').innerHTML = players.map(p =>
    `<div class="score"><div class="name">${escapeHtml(p.name)}</div><div class="pts">${p.id === myId ? p.score : '?'}</div></div>`
  ).join('');
  const n = players.length;
  const board = document.getElementById('scoreboard');
  const cards = board.querySelectorAll('.score');
  const placeCards = () => {
    cards.forEach((card, i) => {
      const angle = -90 + (360 / n) * i;
      const r = 50;
      const rad = angle * Math.PI / 180;
      const x = 50 + r * Math.cos(rad);
      const y = 50 + r * Math.sin(rad);
      card.style.left = x + '%';
      card.style.top = y + '%';
    });
  };
  if (!scoreAnimated) {
    cards.forEach(card => { card.style.left = '50%'; card.style.top = '50%'; });
    requestAnimationFrame(() => {
      placeCards();
      scoreAnimated = true;
    });
  } else {
    placeCards();
  }
}

function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  send({ type: 'chat', text });
  input.value = '';
}

function appendChat(name, text) {
  const box = document.getElementById('chatBox');
  box.innerHTML += `<div><b>${escapeHtml(name)}</b>：${escapeHtml(text)}</div>`;
  box.scrollTop = box.scrollHeight;
}

document.getElementById('chatInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    sendChat();
  }
});

function copyRoom() {
  const text = myRoom || '';
  if (!text) return;
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => {
      alert('房间码已复制：' + text);
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    alert('房间码已复制：' + text);
  } catch (e) {
    alert('复制失败，请手动复制：' + text);
  }
  document.body.removeChild(ta);
}

function eventIcon(id) {
  const icons = {
    prisoner: '⚖️',
    public: '🏘️',
    stag: '🦌',
    volunteer: '🗼',
    ultimatum: '⛵',
    trust: '🏦',
    minority: '🚦',
    cournot: '🏭',
    duel: '🔫',
    repeat_prisoner: '🔒',
    pirate: '🏴‍☠️',
    allpay: '🔨'
  };
  return icons[id] || '🎲';
}
function renderInfoBoard() {
  const board = document.getElementById('infoBoard');
  const list = document.getElementById('infoBoardList');
  if (!board || !list) return;
  const data = window._infoBoard || {};
  const ids = Object.keys(data);
  let html = '';
  if (pendingInfo && Object.keys(pendingInfo).length) {
    html += `<div style="color:#f6d67a;border-bottom:1px solid #d9a75f;margin-bottom:6px;">⏳ 待公开情报（仅情报者可见详情）</div>`;
    Object.keys(pendingInfo).forEach(pid => {
      const e = pendingInfo[pid];
      const p = players.find(x => x.id === pid);
      const name = p ? p.name : '';
      const lines = [];
      if (e && e.identity) lines.push(`身份：${escapeHtml(e.identity.value)}${e.identity.modified ? ' ⚠️' : ''}`);
      if (e && e.skill) lines.push(`技能：${escapeHtml(e.skill.value)}${e.skill.modified ? ' ⚠️' : ''}`);
      if (e && e.score != null) lines.push(`分数：${e.score.value}${e.score.modified ? ' ⚠️' : ''}`);
      html += `<div><b>${escapeHtml(name)}</b>：${lines.join('；') || '暂无'}</div>`;
    });
  } else if (pendingInfoCount > 0) {
    html += `<div style="color:#f6d67a;border-bottom:1px solid #d9a75f;margin-bottom:6px;">⏳ 当前有 ${pendingInfoCount} 条待公开情报（详情仅情报者可见）</div>`;
  }
  ids.forEach(id => {
    const e = data[id];
    const lines = [];
    if (e.identity) lines.push(`身份：${escapeHtml(e.identity.value)}${e.identity.modified ? ' ⚠️' : ''}`);
    if (e.skill) lines.push(`技能：${escapeHtml(e.skill.value)}${e.skill.modified ? ' ⚠️' : ''}`);
    if (e.score != null) lines.push(`分数：${e.score.value}${e.score.modified ? ' ⚠️' : ''}`);
    html += `<div><b>${escapeHtml(e.name || '')}</b>：${lines.join('；') || '暂无'}</div>`;
  });
  if (!html) { board.classList.add('hidden'); list.innerHTML = ''; return; }
  board.classList.remove('hidden');
  list.innerHTML = html;
}
function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
